services:
  - type: web
    name: jalsakshya-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/make_synthetic_data.py && python scripts/seed_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
